<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 40 650 180" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la lettre C de l'icône -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Dégradé pour le losange -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="50%" stop-color="#7A22FF" />
      <stop offset="100%" stop-color="#A155FF" />
    </linearGradient>

    <!-- Nouveau dégradé pour les lettres CF (identique à l'original) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#7A22FF" />
    </linearGradient>
  </defs>

  <!-- Groupe principal ajusté -->
  <g transform="translate(10, 10)">
    
    <!-- Icône : Lettre C parfaite -->
    <path d="M 135,75 
             A 50,50 0 1,0 135,155 
             A 33,33 0 1,1 135,97 
             Z" 
          fill="url(#blueGrad)" />

    <!-- Icône : Losange imbriqué -->
    <path d="M 175,115 L 150,157 L 125,115 L 150,73 Z 
             M 150,90 L 136,115 L 140,140 L 154,115 Z" 
          fill="url(#purpleGrad)" 
          fill-rule="evenodd" />

    <!-- Texte du Logo repositionné avec le nouveau dégradé pour CF -->
    <g transform="translate(210, 142)">
      <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="85" fill="url(#textGrad)" letter-spacing="-2">CF</text>
      <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="85" fill="#222938" x="115" letter-spacing="-2">-Tech</text>
    </g>
    
  </g>
</svg>